name: analyze (OPGG)

# Fast compile check for the OPGG UI (Linux, a few minutes) so errors show
# long before the iOS build would hit them.
on:
  push:
    branches: [main, 'opgg/**']
  workflow_dispatch:

concurrency:
  group: analyze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true
      - run: flutter pub get
      - name: Analyze OPGG code (errors fail, infos/warnings don't)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/opgg lib/app.dart
